name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The Prisma client is generated code; type-check and the server tests need it.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (server, shared)
        run: npm test
      - name: Component tests (web)
        run: npm test -w web
      - name: Design build tests (FigCraft)
        run: npx vitest run design/figcraft/build.test.mjs
      - run: npm run build:web

  integration:
    name: Integration tests (MariaDB via testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration
